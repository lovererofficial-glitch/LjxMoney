name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build unsigned IPA for Sideloadly
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Expo prebuild did not generate an Xcode project."
            exit 1
          fi
          (cd ios && pod install)

      - name: Build and package unsigned IPA
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::No generated Xcode project was found."
            exit 1
          fi

          PROJECT_NAME="$(basename "$PROJECT_FILE" .xcodeproj)"
          WORKSPACE="ios/${PROJECT_NAME}.xcworkspace"
          if [ ! -d "$WORKSPACE" ]; then
            echo "::error::CocoaPods did not generate the expected Xcode workspace: $WORKSPACE"
            exit 1
          fi

          SCHEME="$PROJECT_NAME"
          xcodebuild -list -json -workspace "$WORKSPACE" |
            node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const config = JSON.parse(input);
                const schemes = config.workspace?.schemes ?? config.project?.schemes ?? [];
                const expected = process.argv[1];
                if (!schemes.includes(expected)) {
                  console.error(`Generated Xcode scheme "${expected}" was not found.`);
                  process.exit(1);
                }
              });
            ' "$SCHEME"

          DERIVED_DATA="$RUNNER_TEMP/LjxMoneyDerivedData"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/${PROJECT_NAME}.app"
          if [ ! -d "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::Xcode did not produce the expected iOS app bundle."
            exit 1
          fi

          mkdir -p dist/ios/Payload
          ditto "$APP_PATH" "dist/ios/Payload/${PROJECT_NAME}.app"
          plutil -lint "dist/ios/Payload/${PROJECT_NAME}.app/Info.plist"
          (cd dist/ios && /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload LjxMoney.ipa)

          if ! unzip -tq dist/ios/LjxMoney.ipa >/dev/null ||
            ! unzip -Z1 dist/ios/LjxMoney.ipa | grep -Eq '^Payload/[^/]+\.app/Info\.plist$'; then
            echo "::error::The generated archive is not a valid iOS IPA."
            exit 1
          fi

      - name: Upload IPA for Sideloadly
        uses: actions/upload-artifact@v5
        with:
          name: LjxMoney-iOS-IPA
          path: dist/ios/LjxMoney.ipa
          if-no-files-found: error
          retention-days: 14
